<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Ticket · Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0B14;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);--t1:#fff;--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.28);
  --purple:#AF46FD;--pink:#F4349D;--grad:linear-gradient(135deg,#AF46FD,#DA3BC2,#F4349D);
  --green:#22C55E;--amber:#FB923C;--red:#E54545;--cyan:#22D3EE;
}
[data-theme="light"]{
  --bg:#fbf5f0;--card:rgba(15,15,25,.04);--card2:rgba(15,15,25,.06);
  --border:rgba(15,15,25,.1);--t1:#16151f;--t2:rgba(22,21,31,.55);--t3:rgba(22,21,31,.28);
  --purple:#ec7c6f;--pink:#f2a98e;--grad:linear-gradient(135deg,#ec7c6f,#ef9182,#f2a98e);
}
[data-theme="light"] .sb{background:#f5eee9;border-right-color:rgba(15,15,25,.1)}
[data-theme="light"] .sb-item{color:rgba(22,21,31,.38)}
[data-theme="light"] .sb-item:hover{background:rgba(15,15,25,.06);color:rgba(22,21,31,.7)}
[data-theme="light"] .sb-item.active{background:rgba(236,124,111,.12);color:var(--purple)}
[data-theme="light"] .sb-div{background:rgba(15,15,25,.1)}
[data-theme="light"] .sb-logo{background:rgba(15,15,25,.08)}
[data-theme="light"] .sb-hover-panel{background:#fff;border-color:rgba(15,15,25,.12);color:rgba(22,21,31,.8);box-shadow:0 6px 24px rgba(15,15,25,.1)}
[data-theme="light"] .theme-toggle-btn{color:rgba(22,21,31,.4)}
[data-theme="light"] .theme-toggle-btn:hover{background:rgba(15,15,25,.06);color:rgba(22,21,31,.8)}
[data-theme="light"] .modal{background:#fff;border-color:rgba(15,15,25,.12)}
[data-theme="light"] .sb-ws{border-color:rgba(236,124,111,.3)}
[data-theme="light"] .b-review{background:rgba(236,124,111,.08);color:#ec7c6f;border-color:rgba(236,124,111,.2)}
[data-theme="light"] .cr-type-icon.video{background:rgba(236,124,111,.12);color:#ec7c6f}
[data-theme="light"] .ms-active{background:rgba(236,124,111,.1);color:#ec7c6f}
[data-theme="light"] .sc-icon.purple{background:rgba(236,124,111,.1);color:#ec7c6f}
[data-theme="light"] .spin{border-color:rgba(236,124,111,.15);border-top-color:var(--purple)}
[data-theme="light"] .field-input:focus{border-color:rgba(236,124,111,.35)}
[data-theme="light"] .fi-icon{background:rgba(236,124,111,.1);color:#ec7c6f}
[data-theme="light"] .textarea-input:focus{border-color:rgba(236,124,111,.35)}
[data-theme="light"] .brief-tag{background:rgba(236,124,111,.08);border-color:rgba(236,124,111,.15);color:#ec7c6f}
[data-theme="light"] .msg.mine .msg-bubble{background:rgba(236,124,111,.13);border-color:rgba(236,124,111,.2)}
[data-theme="light"] .chat-input:focus{border-color:rgba(236,124,111,.3)}
[data-theme="light"] .reason-box:focus{border-color:rgba(236,124,111,.4)}
[data-theme="light"] .bn-item.active,[data-theme="light"] .bn-item.active svg{color:#ec7c6f;stroke:#ec7c6f}
[data-theme="light"] .bn-space-avatar{background:linear-gradient(135deg,#ec7c6f,#ef9182,#f2a98e)}
[data-theme="light"] .sd-avatar{background:linear-gradient(135deg,#ec7c6f,#ef9182,#f2a98e)}
[data-theme="light"] .sd-ws-card{background:rgba(236,124,111,.08);border-color:rgba(236,124,111,.2)}
[data-theme="light"] .sd-ws-card::before{background:linear-gradient(135deg,#ec7c6f,#ef9182,#f2a98e)}
[data-theme="light"] .sd-ws-badge{color:#ec7c6f}
[data-theme="light"] .sd-ws-badge::before{background:#ec7c6f}
[data-theme="light"] .sd-item.active-item{background:rgba(236,124,111,.1);border-left-color:#ec7c6f}
html,body{height:100%;width:100%;background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100vh;width:100%;overflow:hidden}

/* ICON SIDEBAR */
.sb{width:56px;flex-shrink:0;background:#0d0d1a;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px}
.sb-logo{width:30px;height:30px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex-shrink:0;overflow:hidden}
.sb-item{width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .15s;color:var(--t3);border:none;background:transparent;text-decoration:none}
.sb-item:hover{background:var(--card2);color:var(--t2)}
.sb-item.active{background:rgba(175,70,253,.1);color:var(--purple)}
.sb-item svg{width:15px;height:15px}
.sb-item span{font-size:8px;font-weight:600}
.sb-div{width:26px;height:1px;background:var(--border);margin:3px 0;flex-shrink:0}
.theme-toggle-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:none;color:var(--t3);transition:background .15s,color .15s;font-family:inherit}
.theme-toggle-btn:hover{background:var(--card2);color:var(--t2)}
.sb-item-wrap{position:relative;display:flex;justify-content:center;width:100%}
.sb-hover-panel{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-6px);background:#13112b;border:1px solid rgba(255,255,255,.12);border-radius:10px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:500;padding:7px 13px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
.sb-item-wrap:hover .sb-hover-panel{opacity:1;pointer-events:all;transform:translateY(-50%) translateX(0)}
.sb-hover-panel::before{content:'';position:absolute;right:100%;top:0;bottom:0;width:14px}
.sb-ws{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid rgba(175,70,253,.3);flex-shrink:0;cursor:pointer}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TOPBAR */
.topbar{flex-shrink:0;height:50px;padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:rgba(11,11,20,.98);z-index:10}
.back-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--t3);padding:5px 8px;border-radius:7px;transition:all .15s;flex-shrink:0;cursor:pointer;border:none;background:none;font-family:inherit;text-decoration:none}
.back-btn:hover{background:var(--card2);color:var(--t1)}
.tb-div{width:1px;height:16px;background:var(--border);flex-shrink:0}
.tb-meta{min-width:0;flex:1}
.tb-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-id{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.05em;margin-top:1px}
.tb-right{flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.badge .dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.b-action{background:rgba(251,146,60,.1);color:var(--amber);border:1px solid rgba(251,146,60,.18)}
.b-progress{background:rgba(34,211,238,.06);color:var(--cyan);border:1px solid rgba(34,211,238,.15)}
.b-done{background:rgba(34,197,94,.06);color:var(--green);border:1px solid rgba(34,197,94,.15)}
.b-review{background:rgba(175,70,253,.08);color:#C084FC;border:1px solid rgba(175,70,253,.2)}
.b-locked{background:rgba(251,146,60,.08);color:var(--amber);border:1px solid rgba(251,146,60,.18)}

/* 2-COL BODY */
.body{flex:1;display:grid;grid-template-columns:1fr 300px;overflow:hidden}

/* LEFT PANEL */
.left{overflow-y:auto;display:flex;flex-direction:column}

/* Creative header */
.cr-header{flex-shrink:0;padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.cr-type-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cr-type-icon.video{background:rgba(175,70,253,.12);color:#C084FC}
.cr-type-icon.static{background:rgba(34,211,238,.08);color:#22D3EE}
.cr-header-info{flex:1;min-width:0}
.cr-header-name{font-size:15px;font-weight:800;margin-bottom:1px}
.cr-header-meta{font-size:11px;color:var(--t3)}

/* Mini stepper */
.mini-stepper{display:flex;align-items:center;gap:0;margin-top:10px}
.ms-step{display:flex;align-items:center;flex:1}
.ms-label{font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;display:flex;align-items:center;gap:3px}
.ms-done{background:rgba(34,197,94,.08);color:var(--green)}
.ms-active{background:rgba(175,70,253,.1);color:#C084FC}
.ms-active.amber{background:rgba(251,146,60,.08);color:var(--amber)}
.ms-pending{background:rgba(255,255,255,.04);color:var(--t3)}
.ms-connector{flex:1;height:1px;background:var(--border);margin:0 4px;min-width:8px}

/* Content body */
.cr-body{flex:1;padding:20px 24px 32px;overflow-y:auto}

/* Section label */
.section-label{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

/* Status cards */
.status-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.status-card.cyan{border-color:rgba(34,211,238,.15);background:rgba(34,211,238,.03)}
.status-card.green{border-color:rgba(34,197,94,.15);background:rgba(34,197,94,.03)}
.status-card.amber{border-color:rgba(251,146,60,.15);background:rgba(251,146,60,.03)}
.sc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc-icon.cyan{background:rgba(34,211,238,.1);color:var(--cyan)}
.sc-icon.green{background:rgba(34,197,94,.1);color:var(--green)}
.sc-icon.amber{background:rgba(251,146,60,.1);color:var(--amber)}
.sc-icon.purple{background:rgba(175,70,253,.1);color:#C084FC}
.sc-t1{font-size:13px;font-weight:700}
.sc-t2{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.5}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid rgba(175,70,253,.15);border-top-color:var(--purple);animation:spin 1s linear infinite;flex-shrink:0}

/* Forms */
.field{margin-bottom:14px}
.field-label{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.field-input{width:100%;height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:12px;outline:none;transition:border-color .15s}
.field-input::placeholder{color:var(--t3)}
.field-input:focus{border-color:rgba(175,70,253,.35)}
.upload-zone{border:1px dashed rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.02);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.upload-zone:hover{border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.04)}
.uz-icon{width:34px;height:34px;border-radius:9px;background:rgba(251,146,60,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--amber)}
.uz-title{font-size:13px;font-weight:600}
.uz-sub{font-size:10px;color:var(--t3);margin-top:2px}
input[type=file]{display:none}
.file-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.file-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.fi-icon{width:20px;height:20px;border-radius:5px;background:rgba(175,70,253,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#C084FC}
.fi-name{flex:1;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-rm{color:var(--t3);cursor:pointer;background:none;border:none;display:flex;padding:2px;transition:color .15s}
.fi-rm:hover{color:var(--red)}
.textarea-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:12px;outline:none;resize:none;line-height:1.55;transition:border-color .15s}
.textarea-input::placeholder{color:var(--t3)}
.textarea-input:focus{border-color:rgba(175,70,253,.35)}

/* Storyline box */
.sl-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.75;color:var(--t2);white-space:pre-wrap;margin-bottom:14px;overflow-y:auto}

/* Feedback box */
.feedback-box{background:rgba(251,146,60,.03);border:1px solid rgba(251,146,60,.14);border-radius:10px;padding:12px;margin-bottom:14px}
.fb-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fb-icon{width:16px;height:16px;border-radius:4px;background:rgba(251,146,60,.12);display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:9px}
.fb-label{font-size:11px;font-weight:700;color:var(--amber)}
.fb-date{font-size:9px;color:var(--t3);margin-left:auto}
.fb-text{font-size:12px;color:var(--t2);line-height:1.55;font-style:italic}

/* Creative image preview */
.cr-preview{border-radius:12px;overflow:hidden;position:relative;margin-bottom:16px;cursor:zoom-in}
.cr-preview img{width:100%;display:block;max-height:380px;object-fit:cover}
.cr-preview .wm-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cr-preview .wm-text{font-size:20px;font-weight:900;color:rgba(255,255,255,.12);letter-spacing:.1em;transform:rotate(-30deg);white-space:nowrap}
.cr-preview .wm-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:3px 9px;border-radius:5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.04em}

/* Detail grid */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.detail-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 12px}
.detail-label{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.detail-val{font-size:12px;color:var(--t1);line-height:1.4}
.detail-link{font-size:11px;color:var(--purple);display:flex;align-items:center;gap:4px;margin-top:4px;word-break:break-all}

/* Shared context */
.context-box{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px 14px 0;margin-bottom:16px}
.context-header{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;padding:10px 0 6px;display:flex;align-items:center;gap:6px}
.context-row{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:10px;align-items:flex-start}
.context-row:last-child{border-bottom:none;padding-bottom:12px}
.context-key{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;width:70px;flex-shrink:0;padding-top:2px}
.context-val{font-size:12px;color:var(--t1);line-height:1.4;flex:1}
.context-tag{padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:10px;color:var(--t2);font-weight:600}

/* Action bar */
.action-bar{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.btn-primary{flex:2;padding:11px 16px;border-radius:10px;border:none;cursor:pointer;background:var(--grad);color:#fff;font-family:inherit;font-size:13px;font-weight:700;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{flex:1;padding:11px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-secondary:hover{background:var(--card2)}
.btn-approve{flex:1;padding:11px 16px;border-radius:10px;border:1px solid rgba(34,197,94,.2);background:rgba(34,197,94,.06);color:var(--green);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-approve:hover{background:rgba(34,197,94,.12)}
.btn-reject{flex:1;padding:11px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-reject:hover{background:var(--card2)}

/* Download button */
.dl-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:10px;border:1px solid rgba(34,197,94,.2);background:rgba(34,197,94,.05);cursor:pointer;transition:background .15s;text-align:left;margin-top:8px;font-family:inherit}
.dl-btn:hover{background:rgba(34,197,94,.1)}
.dl-name{font-size:13px;font-weight:700;color:var(--green);display:block}
.dl-sub{font-size:10px;color:var(--t3);display:block;margin-top:1px}

/* Feedback toggle */
.feedback-toggle{display:none;flex-direction:column;gap:10px;margin-top:12px;padding:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px}
.feedback-toggle.show{display:flex}
.feedback-note{font-size:11px;color:var(--t3);line-height:1.5}

/* RIGHT PANEL */
.right{overflow-y:auto;padding:16px;border-left:1px solid var(--border);display:flex;flex-direction:column}
.sec{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.brief-row{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
.brief-row:last-child{border-bottom:none}
.brief-key{font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.brief-val{font-size:11px;color:var(--t1);line-height:1.4}
.brief-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.brief-tag{padding:1px 6px;border-radius:4px;background:rgba(175,70,253,.08);border:1px solid rgba(175,70,253,.15);font-size:9px;color:#C084FC;font-weight:600}
.chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.chat-title{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:240px}
.msg{display:flex;flex-direction:column;gap:2px}
.msg.mine{align-items:flex-end}
.msg-bubble{max-width:200px;padding:7px 10px;border-radius:9px;font-size:11px;line-height:1.5}
.msg.theirs .msg-bubble{background:rgba(255,255,255,.05);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.mine .msg-bubble{background:rgba(175,70,253,.13);border:1px solid rgba(175,70,253,.2);border-bottom-right-radius:3px}
.msg-from{font-size:9px;font-weight:700;color:var(--t3)}
.msg-time{font-size:8px;color:var(--t3)}
.chat-input-row{display:flex;gap:5px;align-items:flex-end;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);margin-top:8px;flex-shrink:0}
.chat-input{flex:1;min-height:32px;max-height:80px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:11px;outline:none;resize:none;transition:border-color .15s;line-height:1.5}
.chat-input::placeholder{color:var(--t3)}
.chat-input:focus{border-color:rgba(175,70,253,.3)}
.chat-send{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.chat-send:hover{opacity:.8}
.chat-send svg{width:11px;height:11px}

/* Lightbox */
.fs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:900;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.fs-overlay.open{opacity:1;pointer-events:all}
.fs-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s;z-index:1}
.fs-close:hover{background:rgba(255,255,255,.15)}
.fs-close svg{width:15px;height:15px}
.fs-inner{max-width:90vw;max-height:90vh;display:flex;align-items:center;justify-content:center;transform:scale(.96);transition:transform .22s}
.fs-overlay.open .fs-inner{transform:scale(1)}
.fs-inner img{max-width:90vw;max-height:88vh;border-radius:12px;object-fit:contain;display:block}

/* Confirm Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#0d0d1a;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:24px;width:420px;max-width:90vw;transform:translateY(14px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:15px;font-weight:800;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--t2);margin-bottom:14px;line-height:1.6}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.reason-box{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--t1);font-family:inherit;font-size:12px;outline:none;resize:none;line-height:1.55;height:90px;transition:border-color .15s}
.reason-box:focus{border-color:rgba(175,70,253,.4)}
.btn-grad{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer;background:var(--grad);color:#fff;font-family:inherit;font-size:13px;font-weight:700;transition:opacity .15s;flex:1}
.btn-grad:hover{opacity:.85}
.modal-cancel{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.modal-cancel:hover{background:var(--card)}

/* Bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;height:60px;background:rgba(13,12,26,.97);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);align-items:stretch}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:rgba(255,255,255,.35);font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:color .15s;padding:0;text-decoration:none}
.bn-item svg{width:20px;height:20px}
.bn-item.active,.bn-item.active svg{color:#AF46FD;stroke:#AF46FD}
.bn-space-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#AF46FD,#DA3BC2,#F4349D);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:900px){
  .body{grid-template-columns:1fr}
  .right{display:none}
}
@media(max-width:640px){
  .bottom-nav{display:flex}
  html,body{height:auto;overflow-y:auto}
  .app{flex-direction:column;height:auto;min-height:100dvh;overflow:visible}
  .sb{display:none}
  .main{height:auto;overflow:visible;width:100%;display:flex;flex-direction:column}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .topbar{padding:0 14px;height:50px}
  .tb-id,.tb-div{display:none}
  .body{display:flex;flex-direction:column;overflow:visible}
  .right{display:none}
  .cr-body{padding:14px 14px 28px}
  .detail-grid{grid-template-columns:1fr}
  .action-bar{flex-direction:column}
  .btn-primary,.btn-secondary,.btn-approve,.btn-reject{flex:unset;width:100%}
}

function stageBadge(s) {
  if (s === ST.ASSET) return `<span class="badge b-action"><span class="dot"></span>Upload Pending</span>`;
  if ([ST.SL_REVIEW, ST.CR_REVIEW].includes(s)) return `<span class="badge b-review"><span class="dot"></span>Review Needed</span>`;
  if ([ST.ASSET_DONE, ST.SL_REWORK, ST.CR_PENDING, ST.CR_REWORK].includes(s)) return `<span class="badge b-progress"><span class="dot"></span>In Progress</span>`;
  if (s === ST.PAYMENT_PENDING) return `<span class="badge b-locked"><span class="dot"></span>Pay to Download</span>`;
  if (s === ST.DELIVERED) return `<span class="badge b-done"><span class="dot"></span>Delivered</span>`;
  if (s === ST.APPROVED) return `<span class="badge b-done"><span class="dot"></span>Approved</span>`;
  return '';
}

// ── MINI STEPPER ──
const MINI_STEPS = ['Assets','Storyline','Design','Complete'];
function stageToStep(s) {
  if (s <= ST.ASSET) return 0;
  if (s <= ST.SL_REWORK) return 1;
  if (s <= ST.CR_REWORK) return 2;
  return 3;
}
function renderMiniStepper() {
  const activeStep = stageToStep(cs.stage);
  return MINI_STEPS.map((label, i) => {
    let cls = i < activeStep ? 'ms-done' : i === activeStep ? 'ms-active' : 'ms-pending';
    if (i === activeStep && [ST.ASSET, ST.SL_REWORK, ST.CR_REWORK].includes(cs.stage)) cls += ' amber';
    const icon = i < activeStep ? `${chk}` : '';
    const connector = i < MINI_STEPS.length - 1 ? `<div class="ms-connector"></div>` : '';
    return `<div class="ms-step"><div class="ms-label ${cls}">${icon}${label}</div>${connector}</div>`;
  }).join('');
}

// ── FILE HELPERS ──
function fileItem(name) {
  return `<div class="file-item"><div class="fi-icon"><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div><div class="fi-name">${name}</div><button class="fi-rm" onclick="removeFile('${name}')"><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
}
function addFiles(files) {
  Array.from(files).forEach(f => cs.files.push(f.name));
  document.getElementById('fileList').innerHTML = cs.files.map(f => fileItem(f)).join('');
  updateSubmitBtn();
}
function removeFile(name) {
  cs.files = cs.files.filter(f => f !== name);
  document.getElementById('fileList').innerHTML = cs.files.map(f => fileItem(f)).join('');
  updateSubmitBtn();
}
function updateSubmitBtn() {
  const btn = document.getElementById('submitBtn');
  if (!btn) return;
  const url = document.getElementById('urlInput')?.value.trim();
  btn.disabled = !url && cs.files.length === 0;
}
document.addEventListener('input', e => { if (e.target.id === 'urlInput') updateSubmitBtn(); });

// ── ACTIONS ──
function submitAssets() {
  const url = document.getElementById('urlInput')?.value.trim();
  const idea = document.getElementById('ideaInput')?.value.trim();
  if (!url && cs.files.length === 0) { toast('Please add a product link or upload at least one asset.','amber'); return; }
  cs.productUrl = url || '';
  cs.product = idea || '';
  cs.stage = ST.ASSET_DONE;
  if (!cs.storyline) cs.storyline = `Storyline for ${cs.product || 'your product'} is being drafted by our content writer.`;
  renderContent();
  toast('Assets submitted! Our writer will draft the storyline.','green');
}

function approveSL() {
  cs.stage = ST.CR_PENDING;
  renderContent();
  toast('Storyline approved! Designer is now creating your creative.','green');
}

function rejectSL() {
  const feedback = document.getElementById('slFeedback')?.value.trim();
  if (!feedback) { toast('Please add feedback before requesting edits.','amber'); document.getElementById('slFeedback')?.focus(); return; }
  openModal('Storyline Revision Request','Confirm sending this feedback to the writer.',feedback,'sl-reject');
}

function approveCR() {
  cs.approvedDate = timeNow();
  cs.stage = eng.partialPayment ? ST.PAYMENT_PENDING : ST.APPROVED;
  renderContent();
  if (eng.partialPayment) toast('Creative approved! Complete payment to unlock the final file.','amber');
  else toast('Creative approved! Final file will be delivered shortly.','green');
}

function rejectCR() {
  const feedback = document.getElementById('crFeedback')?.value.trim();
  if (!feedback) { toast('Please add feedback before requesting edits.','amber'); document.getElementById('crFeedback')?.focus(); return; }
  openModal('Creative Revision Request','Confirm sending this feedback to the designer.',feedback,'cr-reject');
}

function payNow() {
  cs.stage = ST.DELIVERED;
  renderContent();
  toast('Payment successful! Full-resolution file is now available.','green');
}

let pendingAction = '', pendingFeedback = '';
function openModal(title, sub, feedback, action) {
  pendingAction = action;
  pendingFeedback = feedback;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub;
  document.getElementById('modalExtra').innerHTML = `<div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:12px;color:var(--t2);line-height:1.6;font-style:italic">"${feedback}"</div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function confirmModal() {
  closeModal();
  const now = timeNow();
  if (pendingAction === 'sl-reject') {
    cs.stage = ST.SL_REWORK; cs.feedback = pendingFeedback; cs.feedbackDate = now;
    renderContent(); toast('Feedback submitted. Writer will revise the storyline.','purple');
  } else if (pendingAction === 'cr-reject') {
    cs.stage = ST.CR_REWORK; cs.feedback = pendingFeedback; cs.feedbackDate = now;
    renderContent(); toast('Revision requested. Designer has been notified.','purple');
  }
}

// ── RIGHT PANEL ──
function renderRight() {
  const ftags = (eng.formats || []).map(f => `<span class="brief-tag">${f}</span>`).join('');
  const msgs = (eng.messages || []).map(m => `<div class="msg ${m.mine?'mine':'theirs'}">${!m.mine?`<div class="msg-from">${m.from}</div>`:''}<div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}</div></div>`).join('');
  document.getElementById('rightPanel').innerHTML = `
    <div class="sec">Campaign Brief</div>
    <div class="brief-row"><div class="brief-key">Campaign</div><div class="brief-val">${eng.title}</div></div>
    <div class="brief-row"><div class="brief-key">Category</div><div class="brief-val">${eng.category}</div></div>
    <div class="brief-row"><div class="brief-key">Formats</div><div class="brief-tags">${ftags}</div></div>
    <div class="brief-row"><div class="brief-key">Tone</div><div class="brief-val">${eng.tone}</div></div>
    <div class="brief-row"><div class="brief-key">POC</div><div class="brief-val">${eng.poc}</div></div>
    <div class="brief-row"><div class="brief-key">Delivery</div><div class="brief-val">${eng.delivery}</div></div>
    <div class="chat-wrap">
      <div class="chat-title">Messages</div>
      <div class="chat-msgs" id="chatMsgs">${msgs}</div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" placeholder="Type a message…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
        <button class="chat-send" onclick="sendMsg()"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>`;
  setTimeout(() => { const e = document.getElementById('chatMsgs'); if (e) e.scrollTop = e.scrollHeight; }, 50);
}

// ── LIGHTBOX ──
function openLightbox(src) {
  document.getElementById('fsInner').innerHTML = `<img src="${src}" style="max-width:90vw;max-height:88vh;border-radius:12px;object-fit:contain">`;
  document.getElementById('fsOverlay').classList.add('open');
}
function closeLightbox() { document.getElementById('fsOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── CHAT ──
function sendMsg() {
  const inp = document.getElementById('chatInput'); const text = inp.value.trim(); if (!text) return;
  const msgs = document.getElementById('chatMsgs'); const now = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const d = document.createElement('div'); d.className = 'msg mine';
  d.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">Just now · ${now}</div>`;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; inp.value = ''; inp.style.height = 'auto';
}

// ── HELPERS ──
function timeNow() {
  const d = new Date();
  return `${d.toLocaleString('default',{month:'short'})} ${d.getDate()} · ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ${d.getHours()>=12?'PM':'AM'}`;
}
function toast(msg, type='purple') {
  const c = {green:'rgba(34,197,94,.88)',purple:'rgba(175,70,253,.88)',amber:'rgba(251,146,60,.88)'};
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:${c[type]};backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:100px;font-size:12px;font-weight:700;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap;transition:opacity .3s`;
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

// ── MOUNT ──
renderContent();
renderRight();
</script>
</body>
</html>
