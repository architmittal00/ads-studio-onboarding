<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request Detail · Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0B14;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);--t1:#fff;--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.28);
  --purple:#AF46FD;--pink:#F4349D;--grad:linear-gradient(135deg,#AF46FD,#DA3BC2,#F4349D);
  --green:#22C55E;--amber:#FB923C;--red:#E54545;--cyan:#22D3EE;
}
html,body{height:100%;width:100%;background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100vh;width:100%;overflow:hidden}

/* ── ICON SIDEBAR ── */
.sb{width:56px;flex-shrink:0;background:#0d0d1a;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px}
.sb-logo{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex-shrink:0}
.sb-logo svg{width:12px;height:12px}
.sb-item{width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .15s;color:var(--t3);border:none;background:transparent;text-decoration:none}
.sb-item:hover{background:var(--card2);color:var(--t2)}
.sb-item.active{background:rgba(175,70,253,.1);color:var(--purple)}
.sb-item svg{width:15px;height:15px}
.sb-item span{font-size:8px;font-weight:600}
.sb-div{width:26px;height:1px;background:var(--border);margin:3px 0;flex-shrink:0}
.sb-ws{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid rgba(175,70,253,.3);flex-shrink:0}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{flex-shrink:0;height:50px;padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:rgba(11,11,20,.98);z-index:10}
.back-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--t3);padding:5px 8px;border-radius:7px;transition:all .15s;flex-shrink:0}
.back-btn:hover{background:var(--card2);color:var(--t1)}
.tb-div{width:1px;height:16px;background:var(--border);flex-shrink:0}
.tb-meta{min-width:0;flex:1}
.tb-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-id{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.05em;margin-top:1px}
.tb-right{flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.badge .dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.b-action{background:rgba(251,146,60,.1);color:var(--amber);border:1px solid rgba(251,146,60,.18)}
.b-progress{background:rgba(34,211,238,.06);color:var(--cyan);border:1px solid rgba(34,211,238,.15)}
.b-done{background:rgba(34,197,94,.06);color:var(--green);border:1px solid rgba(34,197,94,.15)}

/* ── 3-COL BODY ── */
.body{flex:1;display:grid;grid-template-columns:220px 1fr 300px;overflow:hidden}

/* ── STAGE NAV ── */
.stage-nav{overflow-y:auto;border-right:1px solid var(--border);padding:20px 0 40px;display:flex;flex-direction:column}
.sn-header{padding:0 16px 14px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.sn-list{display:flex;flex-direction:column}
.sn-item{display:flex;align-items:flex-start;gap:10px;padding:0 16px;cursor:pointer}
.sn-item:last-child .sn-line{display:none}
.sn-track{display:flex;flex-direction:column;align-items:center;width:22px;flex-shrink:0}
.sn-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:800;position:relative;z-index:1;margin-top:3px;transition:all .2s}
.sn-dot.done{background:rgba(34,197,94,.12);border:1.5px solid rgba(34,197,94,.4);color:var(--green)}
.sn-dot.active{background:rgba(175,70,253,.15);border:1.5px solid rgba(175,70,253,.7);color:var(--purple);box-shadow:0 0 0 3px rgba(175,70,253,.08)}
.sn-dot.pending{background:transparent;border:1.5px solid rgba(255,255,255,.12);color:var(--t3)}
.sn-line{width:1.5px;flex:1;min-height:32px;margin-top:2px;transition:background .2s}
.sn-line.done{background:rgba(34,197,94,.2)}
.sn-line.pending{background:rgba(255,255,255,.06)}
.sn-content{flex:1;padding-bottom:24px;padding-top:4px;min-width:0}
.sn-name{font-size:11px;font-weight:700;line-height:1.2;transition:color .15s}
.sn-name.done{color:var(--t3)}
.sn-name.active{color:var(--t1)}
.sn-name.pending{color:var(--t3)}
.sn-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;margin-top:5px;white-space:nowrap}
.sn-badge.action{background:rgba(251,146,60,.08);color:var(--amber);border:1px solid rgba(251,146,60,.18)}
.sn-badge.progress{background:rgba(34,211,238,.05);color:var(--cyan);border:1px solid rgba(34,211,238,.12)}
.sn-badge.green{background:rgba(34,197,94,.06);color:var(--green);border:1px solid rgba(34,197,94,.15)}
.sn-item.sel .sn-content{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;margin-bottom:14px;padding-bottom:8px}
.sn-item.sel .sn-name{color:var(--t1)}

/* ── CONTENT AREA ── */
.left{overflow-y:auto;display:flex;flex-direction:column}
.content-header{flex-shrink:0;padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.content-title{font-size:13px;font-weight:800}
.content-sub{font-size:10px;color:var(--t3);margin-top:1px}
.content-body{flex:1;overflow-y:auto;padding:16px 20px}

/* ── CREATIVE CARDS GRID ── */
.creatives-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ── CREATIVE CARD ── */
.cr-card{border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;background:rgba(255,255,255,.02)}
.cr-card:hover{border-color:rgba(255,255,255,.16);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.cr-card:active{transform:translateY(0)}

/* Card illustration area */
.cr-card-visual{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cr-card-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cr-card-visual .vis-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cr-card-visual .vis-bg-blur{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}

.vis-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vis-icon svg{width:22px;height:22px}
.vis-label{font-size:10px;font-weight:700;position:relative;z-index:1;text-align:center;padding:0 8px}

/* State: upload pending */
.vis-upload .vis-icon{background:rgba(251,146,60,.15);border:1.5px solid rgba(251,146,60,.3);color:var(--amber);animation:uploadBounce 1.8s ease-in-out infinite}
.vis-upload .vis-label{color:var(--amber)}
.vis-upload{background:linear-gradient(160deg,rgba(251,146,60,.08),rgba(251,146,60,.03))}

/* State: working/in-progress */
.vis-working .vis-icon{background:rgba(34,211,238,.1);border:1.5px solid rgba(34,211,238,.25);color:var(--cyan)}
.vis-working .vis-icon::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--cyan);animation:spin 1.2s linear infinite}
.vis-working .vis-label{color:var(--cyan)}
.vis-working{background:linear-gradient(160deg,rgba(34,211,238,.08),rgba(34,211,238,.02))}

/* State: review needed */
.vis-review .vis-icon{background:rgba(175,70,253,.15);border:1.5px solid rgba(175,70,253,.35);color:#C084FC;animation:reviewPulse 2s ease-in-out infinite}
.vis-review .vis-label{color:#C084FC}
.vis-review{background:linear-gradient(160deg,rgba(175,70,253,.1),rgba(175,70,253,.03))}

/* State: approved */
.vis-approved .vis-icon{background:rgba(34,197,94,.12);border:1.5px solid rgba(34,197,94,.3);color:var(--green)}
.vis-approved .vis-label{color:var(--green)}
.vis-approved{background:linear-gradient(160deg,rgba(34,197,94,.08),rgba(34,197,94,.02))}

/* State: delivered */
.vis-delivered .vis-icon{background:rgba(34,197,94,.12);border:1.5px solid rgba(34,197,94,.3);color:var(--green);animation:deliveredPop .4s cubic-bezier(.34,1.56,.64,1) both}
.vis-delivered .vis-label{color:var(--green)}
.vis-delivered{background:linear-gradient(160deg,rgba(34,197,94,.1),rgba(34,197,94,.03))}

/* State: locked */
.vis-locked .vis-icon{background:rgba(251,146,60,.1);border:1.5px solid rgba(251,146,60,.25);color:var(--amber);animation:lockPulse 2s ease-in-out infinite}
.vis-locked .vis-label{color:var(--amber)}
.vis-locked{background:linear-gradient(160deg,rgba(251,146,60,.08),rgba(251,146,60,.02))}

/* Animations */
@keyframes uploadBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reviewPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.8}}
@keyframes lockPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,146,60,.25)}60%{box-shadow:0 0 0 10px rgba(251,146,60,0)}}
@keyframes deliveredPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.anim-card-in{animation:cardIn .3s cubic-bezier(.25,.46,.45,.94) both}

/* Card bottom */
.cr-card-info{padding:11px 13px}
.cr-card-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-card-format{font-size:10px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-card-state{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.cs-upload{background:rgba(251,146,60,.08);color:var(--amber);border:1px solid rgba(251,146,60,.18)}
.cs-working{background:rgba(34,211,238,.06);color:var(--cyan);border:1px solid rgba(34,211,238,.14)}
.cs-review{background:rgba(175,70,253,.08);color:#C084FC;border:1px solid rgba(175,70,253,.2)}
.cs-approved{background:rgba(34,197,94,.06);color:var(--green);border:1px solid rgba(34,197,94,.15)}
.cs-locked{background:rgba(251,146,60,.08);color:var(--amber);border:1px solid rgba(251,146,60,.18)}

/* Payment banner */
.pay-banner{background:rgba(251,146,60,.04);border:1px solid rgba(251,146,60,.18);border-radius:12px;padding:13px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.pay-banner-icon{width:32px;height:32px;border-radius:8px;background:rgba(251,146,60,.1);display:flex;align-items:center;justify-content:center;color:var(--amber);flex-shrink:0}
.pay-banner-body{flex:1;min-width:0}
.pay-banner-title{font-size:12px;font-weight:700;margin-bottom:2px}
.pay-banner-sub{font-size:10px;color:var(--t2)}
.pay-banner-amounts{display:flex;gap:16px;margin-top:6px}
.pay-amount-item{display:flex;flex-direction:column;gap:1px}
.pay-amount-label{font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.pay-amount-val{font-size:12px;font-weight:700}
.pay-amount-val.green{color:var(--green)}
.pay-amount-val.amber{color:var(--amber)}
.pay-btn{flex-shrink:0;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;background:var(--grad);color:#fff;font-family:inherit;font-size:12px;font-weight:700;transition:opacity .15s;white-space:nowrap}
.pay-btn:hover{opacity:.85}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;gap:8px}
.empty-state-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--t3);margin-bottom:4px}
.empty-state-t1{font-size:12px;font-weight:700;color:var(--t2)}
.empty-state-t2{font-size:11px;color:var(--t3);line-height:1.5}

/* ── RIGHT PANEL ── */
.right{overflow-y:auto;padding:16px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column}
.sec{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.brief-row{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
.brief-row:last-child{border-bottom:none}
.brief-key{font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.brief-val{font-size:11px;color:var(--t1);line-height:1.4}
.brief-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.brief-tag{padding:1px 6px;border-radius:4px;background:rgba(175,70,253,.08);border:1px solid rgba(175,70,253,.15);font-size:9px;color:#C084FC;font-weight:600}
.chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.chat-title{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:220px}
.msg{display:flex;flex-direction:column;gap:2px}
.msg.mine{align-items:flex-end}
.msg-bubble{max-width:200px;padding:7px 10px;border-radius:9px;font-size:11px;line-height:1.5}
.msg.theirs .msg-bubble{background:rgba(255,255,255,.05);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.mine .msg-bubble{background:rgba(175,70,253,.13);border:1px solid rgba(175,70,253,.2);border-bottom-right-radius:3px}
.msg-from{font-size:9px;font-weight:700;color:var(--t3)}
.msg-time{font-size:8px;color:var(--t3)}
.chat-input-row{display:flex;gap:5px;align-items:flex-end;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);margin-top:8px;flex-shrink:0}
.chat-input{flex:1;min-height:32px;max-height:80px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:11px;outline:none;resize:none;transition:border-color .15s;line-height:1.5}
.chat-input::placeholder{color:var(--t3)}
.chat-input:focus{border-color:rgba(175,70,253,.3)}
.chat-send{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.chat-send:hover{opacity:.8}
.chat-send svg{width:11px;height:11px}

/* ── ACTION MODAL ── */
.am-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:600;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.am-overlay.open{opacity:1;pointer-events:all}
.am-modal{background:#0E0E1C;border:1px solid rgba(255,255,255,.14);border-radius:20px;width:580px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column;transform:translateY(16px);transition:transform .22s;overflow:hidden}
.am-overlay.open .am-modal{transform:translateY(0)}
.am-head{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.am-head-left{flex:1;min-width:0}
.am-title{font-size:15px;font-weight:800}
.am-sub{font-size:11px;color:var(--t3);margin-top:3px}
.am-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;transition:background .15s}
.am-close:hover{background:var(--card2)}
.am-body{overflow-y:auto;padding:20px 24px;flex:1}
.am-footer{padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px}
.am-footer .btn-grad{flex:1;margin:0}
.am-cancel{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.am-cancel:hover{background:var(--card)}

/* ── MODAL ACTION CONTENT ── */
.field-label{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.field-input{width:100%;height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:12px;outline:none;transition:border-color .15s}
.field-input::placeholder{color:var(--t3)}
.field-input:focus{border-color:rgba(175,70,253,.35)}
.upload-zone{border:1px dashed rgba(255,255,255,.12);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.02);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.upload-zone:hover{border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.04)}
.uz-icon{width:36px;height:36px;border-radius:9px;background:rgba(251,146,60,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--amber)}
.uz-icon svg{width:16px;height:16px}
.uz-title{font-size:13px;font-weight:600}
.uz-sub{font-size:10px;color:var(--t3);margin-top:2px}
input[type=file]{display:none}
.file-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.file-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.fi-icon{width:20px;height:20px;border-radius:5px;background:rgba(175,70,253,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#C084FC}
.fi-name{flex:1;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-rm{color:var(--t3);cursor:pointer;background:none;border:none;display:flex;padding:2px;transition:color .15s}
.fi-rm:hover{color:var(--red)}
.sl-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.75;color:var(--t2);white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-bottom:12px}
.comment-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--t1);font-family:inherit;font-size:12px;outline:none;resize:none;line-height:1.55;transition:border-color .15s}
.comment-input::placeholder{color:var(--t3)}
.comment-input:focus{border-color:rgba(175,70,253,.35)}
.cr-review-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;align-items:start}
.cr-img-wrap{position:relative;border-radius:10px;overflow:hidden}
.cr-img-wrap img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.wm-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wm-text{font-size:15px;font-weight:900;color:rgba(255,255,255,.12);letter-spacing:.1em;transform:rotate(-30deg);white-space:nowrap}
.wm-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:3px 9px;border-radius:5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.04em}
.detail-block{margin-bottom:10px}
.detail-label{font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.detail-val{font-size:12px;color:var(--t1);line-height:1.4}
.detail-link{font-size:11px;color:var(--purple);display:flex;align-items:center;gap:4px;margin-top:2px}

// ── STAGE LOGIC ──
function computeEngStage() {
  const stages = eng.creatives.map(c=>CS[c.id].stage);
  if (stages.every(s=>s>=ST.DELIVERED)) return 4;
  if (stages.every(s=>s>=ST.CR_PENDING)) return 3;
  if (stages.every(s=>s>=ST.ASSET_DONE)) return 2;
  if (stages.some(s=>s>=ST.ASSET)) return 1;
  return 0;
}

function defaultStage() {
  const actionPerStage = [[], [ST.ASSET], [ST.SL_REVIEW], [ST.CR_REVIEW], []];
  for (let i = 1; i <= 4; i++) {
    if (eng.creatives.some(c => actionPerStage[i].includes(CS[c.id].stage))) return i;
  }
  for (let i = 1; i <= 4; i++) {
    if (eng.creatives.some(c => STAGE_STATES[i].includes(CS[c.id].stage))) return i;
  }
  return computeEngStage();
}

let currentStage = defaultStage();

function stageStatus(idx) {
  const es = computeEngStage();
  return idx < es ? 'done' : idx === es ? 'active' : 'pending';
}

function stageCount(idx) {
  if (idx === 0) return null;
  const inStage = eng.creatives.filter(c => STAGE_STATES[idx].includes(CS[c.id].stage));
  const actionStates = [[], [ST.ASSET], [ST.SL_REVIEW], [ST.CR_REVIEW], []];
  const needAction = inStage.filter(c => actionStates[idx].includes(CS[c.id].stage));
  return { total: inStage.length, action: needAction.length };
}

// ── BADGE ──
function engBadge() {
  const anyAction = eng.creatives.some(c=>[ST.ASSET,ST.SL_REVIEW,ST.CR_REVIEW].includes(CS[c.id].stage));
  const allDone = eng.creatives.every(c=>CS[c.id].stage>=ST.DELIVERED);
  if (allDone) return `<span class="badge b-done"><span class="dot"></span>Delivered</span>`;
  if (anyAction) return `<span class="badge b-action"><span class="dot"></span>Action Needed</span>`;
  return `<span class="badge b-progress"><span class="dot"></span>In Progress</span>`;
}

// ── STAGE NAV ──
function renderStageNav() {
  const items = STAGE_LABELS.map((label, i) => {
    const status = stageStatus(i);
    const cnt = stageCount(i);
    const isSelected = i === currentStage;
    const dotIcon = status==='done'
      ? `<svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`
      : status==='active'
        ? `<svg width="7" height="7" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="currentColor"/></svg>`
        : `<span>${i}</span>`;
    const lineStatus = i < computeEngStage() ? 'done' : 'pending';
    let badgeHtml = '';
    if (cnt) {
      if (cnt.action > 0) badgeHtml = `<div class="sn-badge action">${cnt.action} need${cnt.action===1?'s':''} input</div>`;
      else if (cnt.total > 0) badgeHtml = status==='done'
        ? `<div class="sn-badge green">${chk} ${cnt.total} done</div>`
        : `<div class="sn-badge progress">${cnt.total} in progress</div>`;
    }
    return `<div class="sn-item${isSelected?' sel':''}" onclick="setStage(${i})">
      <div class="sn-track">
        <div class="sn-dot ${status}">${dotIcon}</div>
        <div class="sn-line ${lineStatus}"></div>
      </div>
      <div class="sn-content">
        <div class="sn-name ${status}">${label}</div>
        ${badgeHtml}
      </div>
    </div>`;
  }).join('');
  return `<div class="sn-header">Progress</div><div class="sn-list">${items}</div>`;
}

function renderMobileStageTabs() {
  return STAGE_LABELS.map((label, i) => {
    const status = stageStatus(i);
    const isActive = i === currentStage;
    return `<div class="mst-item ${isActive?'active':''} ${status==='done'?'done':''}" onclick="setStage(${i})">
      <div class="mst-dot"></div>${label}
    </div>`;
  }).join('');
}

function setStage(idx) {
  currentStage = idx;
  document.getElementById('stageNav').innerHTML = renderStageNav();
  document.getElementById('mobileStgTabs').innerHTML = renderMobileStageTabs();
  renderContent();
}

      <div class="vis-overlay">
        ${isLocked?'<div class="vis-bg-blur"></div>':''}
        <div class="vis-icon" style="${isLocked?'background:rgba(251,146,60,.2);border-color:rgba(251,146,60,.4);color:var(--amber)':s===ST.APPROVED||s===ST.DELIVERED?'background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.5);color:var(--green)':'background:rgba(175,70,253,.2);border-color:rgba(175,70,253,.5);color:#C084FC'}">${cfg.icon}</div>
        <div class="vis-label" style="${isLocked?'color:var(--amber)':s===ST.APPROVED||s===ST.DELIVERED?'color:var(--green)':'color:#C084FC'}">${cfg.label}</div>
      </div>`;
  } else {
    visualHtml = `
      <div class="vis-overlay">
        <div class="vis-icon">${cfg.icon}</div>
        <div class="vis-label">${cfg.label}</div>
      </div>`;
  }

  return { visualHtml, visualCls: hasImg ? '' : cfg.cls, badge: cfg.badge };
}

// ── CREATIVE CARD ──
function renderCard(c, delay) {
  const cs = CS[c.id];
  const product = cs.product || c.product || '';
  const { visualHtml, visualCls, badge } = cardVisual(c);
  const typeLabel = c.type === 'video' ? '▶ Video' : '⬛ Static';

  return `<div class="cr-card anim-card-in" style="animation-delay:${delay}ms" onclick="openActionModal('${c.id}')">
    <div class="cr-card-visual ${visualCls}">${visualHtml}</div>
    <div class="cr-card-info">
      <div class="cr-card-name">${c.name}</div>
      <div class="cr-card-format">${c.format}</div>
      ${badge}
    </div>
  </div>`;
}

// ── RENDER CONTENT ──
function renderContent() {
  const body = document.getElementById('contentBody');
  const titleEl = document.getElementById('contentTitle');
  const subEl = document.getElementById('contentSub');

  if (currentStage === 0) {
    titleEl.textContent = 'Campaign Brief';
    subEl.textContent = 'Your brief has been shared with the Studio team';
    body.innerHTML = `<div style="background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;overflow:hidden">
      ${[['Campaign',eng.title],['Category',eng.category],['Tone',eng.tone],['Delivery',eng.delivery],['Studio POC',eng.poc]].map(([k,v])=>`
      <div style="padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;gap:16px">
        <span style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase">${k}</span>
        <span style="font-size:11px;color:var(--t1);text-align:right">${v}</span>
      </div>`).join('')}
      <div style="padding:11px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
        <span style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase">Formats</span>
        <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end">${(eng.formats||[]).map(f=>`<span class="brief-tag">${f}</span>`).join('')}</div>
      </div>
    </div>`;
    return;
  }

  const creatives = eng.creatives.filter(c => STAGE_STATES[currentStage].includes(CS[c.id].stage));
  titleEl.textContent = 'Your Creatives';
  subEl.textContent = creatives.length > 0 ? `${creatives.length} creative${creatives.length===1?'':'s'} · ${STAGE_LABELS[currentStage]}` : '';

  if (creatives.length === 0) {
    const isPast = currentStage < computeEngStage();
    body.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        ${isPast?`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>`:
        `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>`}
      </div>
      <div class="empty-state-t1">${isPast?'Stage complete':'Not started yet'}</div>
      <div class="empty-state-t2">${isPast?'All creatives have moved past this stage.':'Creatives haven\'t reached this stage yet.'}</div>
    </div>`;
    return;
  }

  // Payment banner
  const paymentLocked = creatives.filter(c => CS[c.id].stage === ST.PAYMENT_PENDING);
  let html = '';
  if (paymentLocked.length > 0 && eng.partialPayment) {
    html += `<div class="pay-banner" id="payBanner">
      <div class="pay-banner-icon"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <div class="pay-banner-body">
        <div class="pay-banner-title">${paymentLocked.length} creative${paymentLocked.length>1?'s':''} approved — pay to unlock downloads</div>
        <div class="pay-banner-sub">Watermarked previews shown. Complete payment for full-resolution files.</div>
        <div class="pay-banner-amounts">
          <div class="pay-amount-item"><div class="pay-amount-label">Paid</div><div class="pay-amount-val green">${eng.amountPaid}</div></div>
          <div class="pay-amount-item"><div class="pay-amount-label">Remaining</div><div class="pay-amount-val amber">${eng.amountDue}</div></div>
          <div class="pay-amount-item"><div class="pay-amount-label">Total</div><div class="pay-amount-val" style="color:var(--t2)">${eng.totalAmount}</div></div>
        </div>
      </div>
      <button class="pay-btn" onclick="payNow()">Pay ${eng.amountDue} →</button>
    </div>`;
  }

  html += `<div class="creatives-grid">${creatives.map((c,i)=>renderCard(c,i*60)).join('')}</div>`;
  body.innerHTML = html;
}

// ── SHARED CONTEXT PANEL ──
// Shows what the merchant originally submitted — used in all review states
function sharedContextBlock(cs, c) {
  const hasUrl = cs.productUrl;
  const hasDesc = cs.product;
  const hasFiles = cs.files && cs.files.length > 0;
  if (!hasUrl && !hasDesc && !hasFiles) return '';

  const rows = [];
  if (hasDesc) rows.push(`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <div style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;width:76px;flex-shrink:0;padding-top:2px">Product</div>
      <div style="font-size:12px;color:var(--t1);line-height:1.4">${cs.product}</div>
    </div>`);
  if (hasUrl) rows.push(`
    <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <div style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;width:76px;flex-shrink:0">URL</div>
      <a href="${cs.productUrl}" target="_blank" style="font-size:11px;color:var(--purple);display:flex;align-items:center;gap:4px;word-break:break-all">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        ${cs.productUrl}
      </a>
    </div>`);
  if (hasFiles) rows.push(`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0">
      <div style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;width:76px;flex-shrink:0;padding-top:2px">Assets</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${cs.files.map(f=>`
        <div style="display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 8px">
          <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="rgba(255,255,255,.4)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span style="font-size:10px;font-weight:600;color:var(--t2)">${f}</span>
        </div>`).join('')}
      </div>
    </div>`);

  return `<div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px 14px 0;margin-bottom:18px">
    <div style="font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;padding:10px 0 6px;display:flex;align-items:center;gap:6px">
      <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      What you shared
    </div>
    ${rows.join('')}
  </div>`;
}

// ── ACTION MODAL ──
let activeCid = null;

function openActionModal(cid) {
  activeCid = cid;
  const c = eng.creatives.find(x=>x.id===cid);
  const cs = CS[cid];
  const s = cs.stage;

  document.getElementById('amTitle').textContent = c.name;
  document.getElementById('amSub').textContent = `${c.format} · ${c.product || cs.product || ''}`;

  let bodyHtml = '';
  let footerHtml = '';

  if (s === ST.ASSET) {
    bodyHtml = assetBlock(c);
    footerHtml = `<button class="am-cancel" onclick="closeActionModal()">Cancel</button>
      <button class="btn-grad" onclick="submitAssets('${cid}')">${chk} Submit Assets</button>`;

  } else if (s === ST.ASSET_DONE) {
    bodyHtml = `<div class="awaiting-box"><div class="spin" style="width:22px;height:22px;border-width:2px"></div>
      <div><div class="awaiting-t1">Our writer is drafting the storyline</div>
      <div class="awaiting-t2">You'll receive it for review shortly. No action needed from you right now.</div></div></div>`;
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Got it</button>`;

  } else if (s === ST.SL_REVIEW) {
    bodyHtml = sharedContextBlock(cs, c) +
      `<div class="field-label" style="margin-bottom:8px">Storyline Draft</div>
      <div class="sl-box">${cs.storyline||'—'}</div>
      <div class="field-label" style="margin-top:4px;margin-bottom:5px">Feedback (optional)</div>
      <textarea class="comment-input" id="am-sl-comment" rows="3" placeholder="Add feedback before requesting edits, or leave blank to approve…"></textarea>`;
    footerHtml = `<button class="am-cancel btn-reject" onclick="rejectSL('${cid}')">${xSvg} Request Edits</button>
      <button class="btn-grad" onclick="approveSL('${cid}')">${chk} Approve Storyline</button>`;

  } else if (s === ST.SL_REWORK) {
    bodyHtml = sharedContextBlock(cs, c) + (cs.feedback ? `<div class="rework-box">
      <div class="rework-header"><div class="rework-icon"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        <span class="rework-label">Your Feedback</span><span class="rework-date">${cs.feedbackDate}</span></div>
      <div class="rework-text">"${cs.feedback}"</div>
    </div>
    <div class="awaiting-box" style="margin-top:4px"><div class="spin" style="width:20px;height:20px;border-width:2px"></div>
      <div><div class="awaiting-t1">Writer is revising the storyline</div><div class="awaiting-t2">You'll receive an updated version to review soon.</div></div></div>`
    : `<div class="awaiting-box"><div class="spin"></div><div><div class="awaiting-t1">Revising based on your feedback</div></div></div>`);
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Got it</button>`;

  } else if (s === ST.CR_PENDING) {
    bodyHtml = `<div class="awaiting-box"><div class="spin" style="width:22px;height:22px;border-width:2px"></div>
      <div><div class="awaiting-t1">Designer is creating your creative</div>
      <div class="awaiting-t2">A watermarked preview will arrive for your review soon.</div></div></div>`;
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Got it</button>`;

  } else if (s === ST.CR_REVIEW) {
    bodyHtml = crReviewBlock(c, cs, sharedContextBlock(cs, c));
    footerHtml = `<button class="am-cancel btn-reject" onclick="rejectCR('${cid}')">${xSvg} Request Edits</button>
      <button class="btn-grad" onclick="approveCR('${cid}')">${chk} Approve Creative</button>`;

  } else if (s === ST.CR_REWORK) {
    const img = cs.image || c.image || '';
    bodyHtml = sharedContextBlock(cs, c) + (cs.feedback ? `<div class="rework-box">
      <div class="rework-header"><div class="rework-icon"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        <span class="rework-label">Your Feedback</span><span class="rework-date">${cs.feedbackDate}</span></div>
      <div class="rework-text">"${cs.feedback}"</div>
    </div>
    ${img?`<img src="${img}" style="width:100%;border-radius:10px;margin-top:10px;filter:brightness(.5)">`:''}`
    : `<div class="awaiting-box"><div class="spin"></div><div><div class="awaiting-t1">Revising creative based on your feedback</div></div></div>`);
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Got it</button>`;

  } else if (s === ST.APPROVED) {
    bodyHtml = `<div class="approved-box">
      <div class="approved-icon" style="width:30px;height:30px;border-radius:8px">${chk}</div>
      <div><div class="approved-t1">Approved on ${cs.approvedDate||'—'}</div>
      <div class="approved-t2">Final high-resolution file will be delivered shortly.</div></div></div>`;
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Close</button>`;

  } else if (s === ST.DELIVERED) {
    const img = cs.image || c.image || '';
    bodyHtml = `<div class="approved-box" style="margin-bottom:14px">
      <div class="approved-icon" style="width:30px;height:30px;border-radius:8px">${chk}</div>
      <div><div class="approved-t1">Delivered — ready for download</div><div class="approved-t2">Full-resolution file is available below.</div></div></div>
      ${img?`<img src="${img}" style="width:100%;border-radius:12px;margin-bottom:12px;display:block">`:''}
      <button class="dl-btn" onclick="toast('Downloading ${c.name}…','green')">${dlSvg}<div><div class="dl-name">${c.name}</div><div class="dl-sub">${c.format} · Full resolution</div></div></button>`;
    footerHtml = `<button class="btn-grad" onclick="closeActionModal()" style="max-width:140px">Close</button>`;

  } else if (s === ST.PAYMENT_PENDING) {
    const img = cs.image || c.image || '';
    bodyHtml = `${img?`<img src="${img}" style="width:100%;border-radius:12px;margin-bottom:14px;display:block;filter:blur(8px) brightness(.4)">`:''}
      <div style="text-align:center;padding:16px;background:rgba(251,146,60,.04);border:1px solid rgba(251,146,60,.18);border-radius:12px">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">Approved on ${cs.approvedDate||'—'}</div>
        <div style="font-size:11px;color:var(--t2);margin-bottom:16px">Complete payment to unlock the full-resolution download.</div>
        <button class="btn-grad" onclick="payNow()" style="max-width:200px;margin:0 auto">Pay ${eng.amountDue||''} to Unlock →</button>
      </div>`;
    footerHtml = `<button class="am-cancel" onclick="closeActionModal()">Close</button>`;
  }

  document.getElementById('amBody').innerHTML = bodyHtml;
  document.getElementById('amFooter').innerHTML = footerHtml;
  document.getElementById('amOverlay').classList.add('open');
}

function closeActionModal() {
  document.getElementById('amOverlay').classList.remove('open');
  activeCid = null;
}

// ── ASSET BLOCK ──
function assetBlock(c) {
  const cid = c.id;
  return `
    <div class="field-gap">
      <div class="field-label">Product URL</div>
      <input class="field-input" id="url-${cid}" placeholder="Amazon / website link…" value="${CS[cid].productUrl}">
    </div>
    <div class="field-gap">
      <div class="field-label">Assets</div>
      <label class="upload-zone" for="file-${cid}">
        <div class="uz-icon">${uploadSvg}</div>
        <div><div class="uz-title">Drop files or click to upload</div><div class="uz-sub">JPG, PNG, MP4, MOV · Max 200 MB</div></div>
      </label>
      <input type="file" id="file-${cid}" multiple accept="image/*,video/*" onchange="addFiles('${cid}',this.files)">
      <div class="file-list" id="fl-${cid}">${CS[cid].files.map(f=>fileItem(f,cid)).join('')}</div>
    </div>
    <div class="field-gap">
      <div class="field-label">Your Creative Idea</div>
      <textarea class="comment-input" id="prod-${cid}" rows="3" placeholder="Share your creative idea, mood, references or anything you'd like us to capture…">${CS[cid].product||''}</textarea>
    </div>`;
}

function fileItem(name, cid) {
  return `<div class="file-item"><div class="fi-icon"><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div><div class="fi-name">${name}</div><button class="fi-rm" onclick="removeFile('${cid}','${name}')"><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
}

// ── CREATIVE REVIEW BLOCK ──
function crReviewBlock(c, cs, contextHtml='') {
  const img = cs.image || c.image || '';
  return contextHtml + `
    <div class="cr-review-grid">
      <div class="cr-img-wrap">
        ${img
          ? `<img src="${img}" alt="${c.name}" loading="lazy" style="cursor:zoom-in" onclick="openLightbox('${img}','image')">
             <div class="wm-overlay" style="pointer-events:none"><div class="wm-text">WATERMARK</div></div>
             <div class="wm-badge">Preview</div>
             <button class="fs-expand-btn" onclick="openLightbox('${img}','image')">
               <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
             </button>`
          : `<div style="aspect-ratio:1/1;background:rgba(111,87,233,.08);display:flex;align-items:center;justify-content:center;border-radius:10px"><svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="rgba(255,255,255,.15)" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`}
      </div>
      <div>
        <div class="detail-block">
          <div class="detail-label">Product</div>
          <div class="detail-val">${cs.product||c.product||'—'}</div>
          ${cs.productUrl?`<a class="detail-link" href="${cs.productUrl}" target="_blank"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg> View product</a>`:''}
        </div>
        <div class="detail-block">
          <div class="detail-label">Format</div>
          <div class="detail-val">${c.format}</div>
        </div>
        <div class="detail-block">
          <div class="detail-label">Storyboard</div>
          <div class="sl-box" style="font-size:11px;max-height:120px;margin-bottom:0">${cs.storyline||'—'}</div>
        </div>
      </div>
    </div>
    <div style="margin-top:12px">
      <div class="field-label" style="margin-bottom:5px">Feedback (optional)</div>
      <textarea class="comment-input" id="am-cr-comment" rows="2" placeholder="Add feedback before requesting edits, or leave blank to approve…"></textarea>
    </div>`;
}

// ── RIGHT PANEL ──
function renderRight() {
  const ftags = (eng.formats||[]).map(f=>`<span class="brief-tag">${f}</span>`).join('');
  const msgs = (eng.messages||[]).map(m=>`<div class="msg ${m.mine?'mine':'theirs'}">${!m.mine?`<div class="msg-from">${m.from}</div>`:''}<div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}</div></div>`).join('');
  return `
    <div class="sec">Brief</div>
    <div class="brief-row"><div class="brief-key">Campaign</div><div class="brief-val">${eng.title}</div></div>
    <div class="brief-row"><div class="brief-key">Category</div><div class="brief-val">${eng.category}</div></div>
    <div class="brief-row"><div class="brief-key">Formats</div><div class="brief-tags">${ftags}</div></div>
    <div class="brief-row"><div class="brief-key">Tone</div><div class="brief-val">${eng.tone}</div></div>
    <div class="brief-row"><div class="brief-key">POC</div><div class="brief-val">${eng.poc}</div></div>
    <div class="brief-row"><div class="brief-key">Delivery</div><div class="brief-val">${eng.delivery}</div></div>
    <div class="chat-wrap">
      <div class="chat-title">Messages</div>
      <div class="chat-msgs" id="chatMsgs">${msgs}</div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" placeholder="Type a message…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
        <button class="chat-send" onclick="sendMsg()"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>`;
}

// ── MOUNT ──
function mount() {
  document.getElementById('stageNav').innerHTML = renderStageNav();
  document.getElementById('mobileStgTabs').innerHTML = renderMobileStageTabs();
  renderContent();
  document.getElementById('rightPanel').innerHTML = renderRight();
  document.getElementById('tbRight').innerHTML = engBadge();
  setTimeout(()=>{const e=document.getElementById('chatMsgs');if(e)e.scrollTop=e.scrollHeight;},50);
}
mount();

// ── REFRESH ──
function refreshAll(leavingCid) {
  document.getElementById('stageNav').innerHTML = renderStageNav();
  document.getElementById('mobileStgTabs').innerHTML = renderMobileStageTabs();
  renderContent();
  document.getElementById('tbRight').innerHTML = engBadge();
}

// ── ASSET ACTIONS ──
function addFiles(cid, files) {
  Array.from(files).forEach(f=>{CS[cid].files.push(f.name);});
  const el=document.getElementById(`fl-${cid}`);
  if(el)el.innerHTML=CS[cid].files.map(f=>fileItem(f,cid)).join('');
}
function removeFile(cid, name) {
  CS[cid].files=CS[cid].files.filter(f=>f!==name);
  const el=document.getElementById(`fl-${cid}`);
  if(el)el.innerHTML=CS[cid].files.map(f=>fileItem(f,cid)).join('');
}
function submitAssets(cid) {
  const desc=document.getElementById(`prod-${cid}`)?.value.trim();
  const url=document.getElementById(`url-${cid}`)?.value.trim();
  const hasUrl = !!url;
  const hasAssets = CS[cid].files.length > 0;
  if(!hasUrl && !hasAssets){
    toast('Please add a product link or upload at least one asset to continue.','amber');
    const urlInput=document.getElementById(`url-${cid}`);
    const uploadZone=document.querySelector(`label[for="file-${cid}"]`);
    if(urlInput){urlInput.style.borderColor='rgba(251,146,60,.6)';setTimeout(()=>urlInput.style.borderColor='',2500);}
    if(uploadZone){uploadZone.style.borderColor='rgba(251,146,60,.6)';setTimeout(()=>uploadZone.style.borderColor='',2500);}
    return;
  }
  CS[cid].product=desc||''; CS[cid].productUrl=url||'';
  CS[cid].stage=ST.ASSET_DONE;
  if(!CS[cid].storyline)CS[cid].storyline=`Storyline for ${desc||'your product'} is being drafted by our content writer.`;
  closeActionModal();
  currentStage=2;
  refreshAll();
  toast('Assets submitted! Our writer will draft the storyline.','green');
}

// ── STORYLINE ACTIONS ──
function approveSL(cid){
  CS[cid].stage=ST.CR_PENDING;
  closeActionModal(); currentStage=3; refreshAll();
  toast('Storyline approved! Designer is now creating your creative.','green');
}
function rejectSL(cid){
  pendingCid=cid; pendingAction='sl-reject';
  const comment=document.getElementById('am-sl-comment')?.value.trim();
  openModal('Storyline Revision Request','Tell us what to change and our writer will revise the storyline.',comment,'Send Feedback');
}

// ── CREATIVE ACTIONS ──
function approveCR(cid){
  CS[cid].approvedDate=timeNow();
  CS[cid].stage=eng.partialPayment?ST.PAYMENT_PENDING:ST.APPROVED;
  closeActionModal();
  if(eng.partialPayment){toast('Creative approved! Complete payment to unlock the final file.','amber');}
  else{currentStage=4;toast('Creative approved! Final file will be delivered shortly.','green');}
  refreshAll();
}
function rejectCR(cid){
  pendingCid=cid; pendingAction='cr-reject';
  const comment=document.getElementById('am-cr-comment')?.value.trim();
  openModal('Request Creative Revision','Share what needs to change and our designer will update it.',comment,'Send Feedback');
}
function payNow(){
  closeActionModal();
  eng.creatives.forEach(c=>{if(CS[c.id].stage===ST.PAYMENT_PENDING)CS[c.id].stage=ST.DELIVERED;});
  refreshAll();
  toast('Payment successful! Full-resolution files are now available.','green');
}

// ── CONFIRM MODAL ──
let pendingCid='', pendingAction='';
function openModal(title,sub,prefill='',confirmLabel='Confirm'){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalSub').textContent=sub;
  document.getElementById('modalExtra').innerHTML=`<textarea class="reason-box" id="reasonBox" placeholder="Describe the changes you'd like…">${prefill||''}</textarea>`;
  document.getElementById('modalConfirmBtn').textContent=confirmLabel;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function confirmModal(){
  const reason=document.getElementById('reasonBox')?.value.trim();
  if(!reason){toast('Please add feedback before submitting.','amber');return;}
  closeModal();
  const now=timeNow();
  if(pendingAction==='sl-reject'){
    CS[pendingCid].stage=ST.SL_REWORK; CS[pendingCid].feedback=reason; CS[pendingCid].feedbackDate=now;
    closeActionModal(); refreshAll(); toast('Feedback submitted. Writer will revise the storyline.','purple');
  } else if(pendingAction==='cr-reject'){
    CS[pendingCid].stage=ST.CR_REWORK; CS[pendingCid].feedback=reason; CS[pendingCid].feedbackDate=now;
    closeActionModal(); refreshAll(); toast('Revision requested. Designer has been notified.','purple');
  }
}

// ── CHAT ──
function sendMsg(){
  const inp=document.getElementById('chatInput'); const text=inp.value.trim(); if(!text)return;
  const msgs=document.getElementById('chatMsgs'); const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const d=document.createElement('div'); d.className='msg mine';
  d.innerHTML=`<div class="msg-bubble">${text}</div><div class="msg-time">Just now · ${now}</div>`;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; inp.value=''; inp.style.height='auto';
}

// ── LIGHTBOX ──
function openLightbox(src, type) {
  const inner = document.getElementById('fsInner');
  inner.innerHTML = type === 'video'
    ? `<video src="${src}" controls autoplay style="max-width:90vw;max-height:88vh;border-radius:12px"></video>`
    : `<img src="${src}" style="max-width:90vw;max-height:88vh;border-radius:12px;object-fit:contain">`;
  document.getElementById('fsOverlay').classList.add('open');
}
function closeLightbox() {
  document.getElementById('fsOverlay').classList.remove('open');
  // pause any video
  const v = document.querySelector('#fsInner video');
  if (v) v.pause();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── HELPERS ──
function timeNow(){const d=new Date();return `${d.toLocaleString('default',{month:'short'})} ${d.getDate()} · ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ${d.getHours()>=12?'PM':'AM'}`;}
function toast(msg,type='purple'){
  const c={green:'rgba(34,197,94,.88)',purple:'rgba(175,70,253,.88)',amber:'rgba(251,146,60,.88)'};
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:${c[type]};backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:100px;font-size:12px;font-weight:700;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap;transition:opacity .3s`;
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},3000);
}
</script>
</body>
